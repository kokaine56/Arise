<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#08090b" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#edeff2" />
    <meta
      name="description"
      content="Arise — a private, personal health space. Define your recurring health goals once, then see what today asks of you."
    />
    <title>Arise</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..600&family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap"
    />

    <script>
      // Resolve the theme before first paint so there is never a flash of the
      // wrong surface. Only a cosmetic preference lives here — never data.
      (function () {
        try {
          var stored = localStorage.getItem('arise.theme');
          var system =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
          var theme = stored === 'light' || stored === 'dark' ? stored : system;
          document.documentElement.setAttribute('data-theme', theme);
        } catch (_) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Arise needs JavaScript enabled to show your daily health checklist.
    </noscript>
    <!--
      Runtime configuration, written by the container's entrypoint from real
      environment variables. It 404s harmlessly in dev, where the app falls
      back to Vite's import.meta.env. Loaded before the bundle so the values are
      present on the first read, and never cached.
    -->
    <script src="/env.js"></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

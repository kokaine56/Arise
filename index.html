<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#08090b" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#edeff2" />
    <meta
      name="description"
      content="Arise — a private, personal health space. Define your recurring health goals once, then see what today asks of you."
    />
    <title>Arise</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@300..700&family=Geist+Mono:wght@400..600&display=swap"
    />

    <script>
      // Resolve the theme before first paint so there is never a flash of the
      // wrong surface. Only a cosmetic preference lives here — never data.
      (function () {
        try {
          var stored = localStorage.getItem('arise.theme');
          var system =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
          var theme = stored === 'light' || stored === 'dark' ? stored : system;
          document.documentElement.setAttribute('data-theme', theme);
        } catch (_) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>

    <!--
      Runtime configuration, written by the container's entrypoint from real
      environment variables so one image can serve any Supabase project.

      This stays in the head, ahead of the bundle, and is a blocking classic
      script on purpose. Vite hoists the module entry point into the head during
      the build and leaves tags in the body behind, so a tag written next to
      src/main.tsx ends up *after* the bundle in dist/. That happens to work only
      because module scripts are deferred — a parser-blocking script in the head
      cannot lose that race, whatever Vite does to the markup.

      Never add type="module": Vite would then try to bundle /env.js, and the
      file only exists at runtime. That build emits "can't be bundled without
      type=module attribute" and, worse, the config would never load.
    -->
    <script src="/env.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      Arise needs JavaScript enabled to show your daily health checklist.
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

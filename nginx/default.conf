# Arise is a client-routed single-page app, so nginx has one job: serve the
# built assets, and hand every unknown path back to index.html so React Router
# can resolve it on the client.

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        application/javascript
        application/json
        image/svg+xml
        text/css
        text/plain;

    # Container health, also used by the load balancer.
    location = /healthz {
        access_log off;
        default_type text/plain;
        include /etc/nginx/snippets/security-headers.conf;
        return 200 "ok\n";
    }

    # Hashed filenames change whenever their content does, so a stale copy in a
    # browser is impossible. `immutable` stops revalidating on every load.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Runtime configuration. `no-store` matters: a cached env.js points a newly
    # deployed container at the previous Supabase project.
    location = /env.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        try_files $uri =404;
    }

    # The HTML shell names the current hashed bundles, so it must be revalidated
    # on every navigation.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate" always;
    }

    # Client-side routing. Without this, a hard refresh on /goals or /settings
    # would 404, which is the single most common way to break an SPA deployment.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}

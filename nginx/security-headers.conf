# Security headers shared by every location.
#
# nginx replaces the inherited add_header set as soon as a level defines one of
# its own, so a location that sets Cache-Control silently drops these. Every
# location therefore includes this file rather than relying on inheritance.
#
# Deliberately absent: Content-Security-Policy. A strict policy would need a
# nonce for the theme bootstrap script in index.html and a hash for the inline
# styles Framer Motion emits, and a policy that breaks the app in production is
# worse than none. Add one with a report-only header first if you want to see
# what it would cost.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

# Supabase is a separate origin, so nothing here may be framed or embedded.
add_header Content-Security-Policy "frame-ancestors 'none'" always;
